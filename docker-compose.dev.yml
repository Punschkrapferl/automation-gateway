services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant
    ports:
      - "6333:6333"           # exposing for debugging
    volumes:
      - qdrant_storage:/qdrant/storage

  rag-api:
    image: punschkrapferl23/rag-agent-service-api:latest
    container_name: rag-api
    depends_on:
      - qdrant
    environment:
      - ENVIRONMENT=docker
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    ports:
      - "8000:8000"           # for direct testing with curl/Postman

  automation-gateway:
    # use pre-built image from Docker Hub
    image: punschkrapferl23/automation-gateway:latest

    # if wanting to build locally instead of pulling:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # image: automation-gateway:latest

    container_name: automation-gateway
    depends_on:
      - rag-api
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AI_SERVICE_BASE_URL=http://rag-api:8000
    ports:
      - "8080:8080"

volumes:
  qdrant_storage:
