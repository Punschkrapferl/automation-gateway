services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant
    ports:
      - "6333:6333"           # exposing for debugging
    volumes:
      - qdrant_storage:/qdrant/storage

  rag-api:
    image: punschkrapferl23/rag-agent-service-api:v1.0.2
    container_name: rag-api
    depends_on:
      - qdrant
    environment:
      - ENVIRONMENT=docker
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    ports:
      - "8000:8000"           # for direct testing with curl/Postman

  automation-gateway:
    # use pre-built image from Docker Hub
    image: punschkrapferl23/automation-gateway:latest

    # if wanting to build locally instead of pulling:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # image: automation-gateway:latest

    container_name: automation-gateway
    depends_on:
      - rag-api
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AI_SERVICE_BASE_URL=http://rag-api:8000
    ports:
      - "8080:8080"

  n8n:
    image: n8nio/n8n:1.123.5
    ports:
      - "5678:5678"
    volumes:
      - ~/.n8n:/home/node/.n8n
    environment:
      - DB_SQLITE_POOL_SIZE=5
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false      # silence Rudder error
      - N8N_PERSONALIZATION_ENABLED=false  # silence Rudder error

volumes:
  qdrant_storage:
