server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:automation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://rag-api:8000}

